name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: unzip -o BlackHole_FabricMod_src.zip -d proj
      - run: sed -i 's/net.minecraft.world.level.LevelResource/net.minecraft.world.level.storage.LevelResource/' proj/src/main/java/com/blackhole/BlackHoleManager.java
      - run: cd proj && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-mod
          path: proj/build/libs/*.jar
